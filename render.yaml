services:
  - type: web
    name: mikeygpt
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: google
      - key: VITE_AUTH_MODE
        value: google
      - key: AI_PROVIDER
        value: openai
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_OWNER_EMAIL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_ACCESS_PASSWORD
        sync: false
